name: 🎭 Playwright Tests

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select test suite"
        type: choice
        options:
          - all
          - sanity
          - regression
          - e2e
          - api
          - web
          - datadriven
        default: "e2e"

      browser:
        description: "Select browser"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: "chromium"

      mode:
        description: "Run mode"
        type: choice
        options:
          - headless
          - headed
        default: "headless"

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest

    steps:

      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install

      - name: 🧪 Run Playwright Tests
        shell: pwsh
        run: |
          $suite = "${{ inputs.test_suite }}"
          $browser = "${{ inputs.browser }}"
          $mode = "${{ inputs.mode }}"

          $browserFlag = "--project=$browser"

          if ($mode -eq "headed") {
            $modeFlag = "--headed"
          } else {
            $modeFlag = ""
          }

          if ($suite -eq "all") {
            npx playwright test $browserFlag $modeFlag
          } else {
            npx playwright test --grep "@$suite" $browserFlag $modeFlag

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

        env:
          CI: "1"

      - name: 📊 Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: 📋 Upload Custom Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: custom-report
          path: custom-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: 📈 Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 30